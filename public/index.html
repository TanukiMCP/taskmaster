    <title>Taskmaster</title>
    <style>
      :root { color-scheme: light dark; }

  <body>

      <h1>Taskmaster</h1>
      <p>An MCP server that runs a task as steps that each build on the results of the steps before them.</p>
      <p>Add it in Claude as a custom connector using <code>https://&lt;this-site&gt;/mcp/&lt;token&gt;</code>.</p>
      <p><a href="https://github.com/TanukiMCP/taskmaster">Source on GitHub</a></p>
    </main>
