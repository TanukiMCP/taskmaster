[project]
name = "taskmaster"
version = "3.0.0"
description = "MCP server that runs a task as a composition of operations in dependency order"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.scripts]
taskmaster = "taskmaster.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskmaster"]

[tool.hatch.build.targets.wheel.force-include]
"library" = "taskmaster/_library"

[tool.pytest.ini_options]
testpaths = ["tests"]
