[project]
name = "taskmaster"
version = "2.0.0"
description = "Design-based execution MCP server driven by a scope and situation matrix"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.scripts]
taskmaster = "taskmaster.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskmaster"]

[tool.hatch.build.targets.wheel.force-include]
"design" = "taskmaster/design"

[tool.pytest.ini_options]
testpaths = ["tests"]
