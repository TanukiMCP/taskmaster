[project]
name = "coherence-mcp"
version = "4.1.0"
description = "Derive a project's coherent shape from real sources, get one approval, and build it under a closed world"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
]

[project.scripts]
coherence-mcp = "coherence.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coherence"]

[tool.hatch.build.targets.wheel.force-include]
"library" = "coherence/_library"

[tool.pytest.ini_options]
testpaths = ["tests"]
